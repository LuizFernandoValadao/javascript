<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somando Números</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }

        body {
            font: normal 18pt Arial;
        }

        main {
            border: 1px solid black;
            width: 500px;
            padding: 20px;
            margin: 20px;
            background-color: rgb(238, 238, 130);
            border-radius: 20px;
        }

        h1 {
            text-shadow: 2px 2px 3px rgba(0, 0, 0, 0.322);
        }

        input {
            font: normal 18pt Arial;
            width: 100px;
            border-radius: 5px;
            background-color: rgb(174, 245, 242);
        }

        div#res {
            margin-top: 20px;
        }

        input#botao {
            background-color: green;
            border-radius: 10px;
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.253);
        }
    </style>
</head>
<body>
    <main>
        <h1>Somando Valores</h1>
        <input type="number" name="txtn1" id="txtn1"> +
        <input type="number" name="txtn2" id="txtn2">
        <input id="botao" type="button" value="Somar" onclick="somar()">
        <div id="res">Resultado</div>
    </main>
    <script>
        
        function somar() {
            var tn1 = document.getElementById('txtn1')
            var tn2 = document.getElementById('txtn2')
            var res = document.getElementById('res')
            var n1 = Number(tn2.value)
            var n2 = Number(tn1.value)
            var s = n1 + n2
            res.innerHTML = `A soma entre ${n1} e ${n2} é igual a <strong>${s}</strong>`
        }
    </script>
</body>
</html>
