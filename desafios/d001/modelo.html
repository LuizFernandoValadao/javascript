<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Exercício</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <header>
        <h1>Analisador de Números</h1>
    </header>
    <section>
        <div>
            <p style="margin-bottom: 20px;">
                <label for="txtnum">Número (entre 1 e 100):</label>
                <input type="number" name="numero" id="txtnum">
                <input id="botao" type="button" value="Adicionar" onclick="adicionar()">
            </p>
        </div>
        <div>
            <select style="width: 180px;" name="nlista" id="nlista" size="6">

            </select>
            <p>
                <input id="botao" type="button" value="Finalizar" onclick="finalizar()">
            </p>
        </div>
    </section>
    <footer>
        <p>&copy; CursoemVídeo</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
